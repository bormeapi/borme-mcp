name: ci

# This repo holds a local stdio MCP server that wraps the BORME API REST
# endpoints, plus the connection guides for the hosted server at
# mcp.bormeapi.com. CI checks that the server lists exactly the tools in
# tools.json and the 4 prompts, 3 resources and 1 resource template the
# hosted server also offers (with no key and no network, in the image too),
# that tools.json still matches the hosted server, and that the public tree
# discloses nothing it should not.
#
# If the "tools.json matches the hosted server" step fails, the hosted tools
# changed: run `python scripts/update_tools.py`, commit tools.json and, for a
# new or renamed tool, add its handler to server.py.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: live tools/list from the hosted server, anonymously
        run: |
          curl -sS --fail --retry 3 https://mcp.bormeapi.com/mcp \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            -o "$RUNNER_TEMP/tools.json"
      - name: repository guards and README tool list
        run: python scripts/check_repo.py "$RUNNER_TEMP/tools.json"
      - name: tools.json matches the hosted server
        run: python scripts/update_tools.py --check
      - name: install the server
        run: pip install -r requirements.txt
      - name: tools, prompts and resources over stdio (python server.py)
        run: python tests/test_tools_list.py

  docker:
    # The image is what Glama builds to inspect the server. Listing must work
    # with no key and no network, so the container runs with --network none.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: docker build -t borme-mcp:ci .
      - name: tools, prompts and resources over stdio through the image, offline
        run: python tests/test_tools_list.py docker run -i --rm --network none borme-mcp:ci
