# Act-type vocabulary: canonical ES label -> EN enum + arg style.
# style: colon  = label followed by ":" and payload
#        noarg  = bare label (payload optional free text until next label)
#        ending = terminates the act chain (Datos registrales)
# variants: accent/typo variants seen in the corpus (matching is accent-folded anyway;
#           list here only variants that differ beyond accents).
# label: optional display name of the enum, where `es` would mislead (it is
#        never matched against the text).
# Derived from own corpus scans (2026-07 + samples 2009/2015). MIT-clean.

